<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Modpack</title>
    
    <!-- Подключаем пиксельный шрифт -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            width: 100%;
            max-width: 450px;
        }

        .pixel-btn {
            display: block;
            width: 100%;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            padding: 25px 15px;
            font-size: 14px;
            letter-spacing: 0.5px;
            border-radius: 12px; 
            transition: background-color 0.2s ease, transform 0.1s ease; 
        }

        .pixel-btn:hover {
            background-color: #222222;
        }

        .pixel-btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            .container {
                gap: 30px;
                padding: 0 10px;
            }
            .pixel-btn {
                font-size: 11px;
                padding: 22px 10px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Кнопка скачивания сборки -->
        <a href="modpack.zip" download="Minecraft-Modpack.zip" class="pixel-btn">
            Download mod pack
        </a>

        <!-- Кнопка Telegram-канала -->
        <a href="https://t.me" target="_blank" class="pixel-btn">
            My TGK
        </a>

    </div>

</body>
</html>
